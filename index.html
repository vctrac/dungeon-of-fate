<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

#game{width:min(720px,100vw);height:100vh;height:100dvh;padding:calc(7px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:4px}
#hud{display:grid;grid-template-columns:1fr 1.25fr .8fr 1fr;gap:4px}.stat{background:#24211e;border:1px solid #514940;border-radius:8px;padding:2px;text-align:center}.label{font-size:7px;color:#9e9588;letter-spacing:1px;text-transform:uppercase}.value{font-size:14px;font-weight:900;line-height:18px}
#message{height:29px;display:flex;align-items:center;justify-content:center;text-align:center;color:#d8bf86;font-size:12px;padding:0 8px}
#board{position:relative;flex:1;min-height:0;border:2px solid #4d463e;border-radius:14px;background:#181614;overflow:hidden;touch-action:manipulation}
.cell{position:absolute;width:7.2%;height:7.2%;display:flex;align-items:center;justify-content:center;z-index:3;cursor:pointer;touch-action:manipulation;transition:opacity .18s,filter .18s,transform .12s}.cell:active{transform:scale(.94)}
.floor{position:absolute;inset:1px;background:#413b35;border:2px solid #655b51;border-radius:6px;box-shadow:inset 0 2px #ffffff0a,inset 0 -3px #0006,0 2px 3px #0008}
.cell.available .floor{border-color:#c19a58;box-shadow:0 0 14px #b8945844}.cell.current .floor{border-color:#e0bb69;box-shadow:0 0 20px #d2a65377}.cell.searched .floor{background:#35302b;border-color:#575049}
.cell.treasure .floor{background:linear-gradient(#55472f,#3c3328);border-color:#b99752}.cell.rich .floor{background:linear-gradient(#4c3d51,#352e38);border-color:#a88cc3}.cell.monster .floor{background:linear-gradient(#4d302e,#382726);border-color:#a86158}.cell.trap .floor{background:linear-gradient(#4e392a,#382c24);border-color:#b77b4b}.cell.heal .floor{background:linear-gradient(#34483a,#29372e);border-color:#72a67c}.cell.key .floor{background:linear-gradient(#30404b,#29343a);border-color:#709ab0}
.icon{position:relative;z-index:5;font-size:16px;font-weight:900;text-shadow:0 2px 3px #000;pointer-events:none}.unknown .icon{font-size:14px;color:#b7ad9f}.event{position:absolute;right:1px;bottom:0;z-index:6;font-size:12px;pointer-events:none}.startMark,.exitMark{position:absolute;left:2px;z-index:6;font-size:6px;pointer-events:none}.startMark{top:0;color:#aaa093}.exitMark{bottom:0;color:#cdb36f}
.link{position:absolute;background:#70655a;z-index:1;border-radius:4px;box-shadow:0 1px 3px #000;pointer-events:none}.link.recent{background:#aa8d5c}.link.old{opacity:.46}.link.veryold{opacity:.24}
#hint{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);color:#70675d;font-size:9px;pointer-events:none;white-space:nowrap}
#overlay{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.panel{width:min(450px,100%);background:#29241f;border:2px solid #6c5940;border-radius:17px;padding:18px;text-align:center}.panel h1{margin:0 0 5px;font-size:24px}.panel p{color:#c0b5a6;font-size:12px;margin:6px 0}.big{font-size:36px;font-weight:950;margin:7px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:12px 0;text-align:left}.summary div{background:#211e1b;border:1px solid #494039;border-radius:8px;padding:7px;font-size:10px;color:#a99f91}.summary b{display:block;color:#eee;font-size:14px;margin-top:2px}.actions{display:flex;gap:7px;justify-content:center}.panel button{min-height:44px;border:1px solid #6d5a3f;background:#76572c;color:#fff;border-radius:10px;font-size:11px;font-weight:900;padding:0 18px}.panel button.secondary{background:#3b3631;border-color:#5b5147}
#diceOverlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30}.dicePanel{width:min(350px,90vw);background:#29241f;border:2px solid #6c5940;border-radius:18px;padding:22px;text-align:center}.diceTitle{font-size:13px;color:#d8bf86;font-weight:900;letter-spacing:1px;text-transform:uppercase}.die{width:76px;height:76px;margin:18px auto 10px;background:#e7dfd2;color:#27221d;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:950;box-shadow:0 5px 15px #0008}.diceResult{font-size:22px;font-weight:950;min-height:28px}.diceDetail{font-size:12px;color:#b8ad9f;min-height:20px}
@keyframes shake{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-9deg) scale(1.08)}75%{transform:rotate(9deg) scale(1.08)}}.rolling{animation:shake .12s infinite}

/* V2.7 local torch-lighting */
.cell.current .floor{box-shadow:0 0 24px #d2a65399,0 0 46px #d2a65333,inset 0 2px #ffffff12,inset 0 -3px #0006}
.cell.available .floor{box-shadow:0 0 16px #b8945866,inset 0 2px #ffffff0b,inset 0 -3px #0006}


/* V2.8 fixed fast travel */
.cell.fast-target .floor{
  border-color:#e0bb69;
  box-shadow:0 0 18px #d2a65377,inset 0 2px #ffffff12,inset 0 -3px #0006;
}
.cell.fast-charge::after{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:9px;
  z-index:8;
  pointer-events:none;
  padding:3px;
  background:conic-gradient(#f0ca78 var(--charge,0deg),transparent 0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
}
.cell.travel-step .floor{
  border-color:#f1cf82!important;
  box-shadow:0 0 28px #e0b65cbb,0 0 48px #d2a65355!important;
  filter:brightness(1.28) saturate(1.08);
}

#message{height:54px!important;min-height:54px;border-top:1px solid #403a34;background:#12100f;border-radius:10px;padding:7px 12px!important;justify-content:flex-start!important;text-align:left!important;font-size:12px!important;line-height:16px}
#diceOverlay{background:rgba(7,6,5,.55)!important;backdrop-filter:blur(2px)}
.encounterPanel{width:min(88%,360px);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.eventCard{width:148px;height:174px;border:2px solid #8d5149;border-radius:13px;background:radial-gradient(circle,#542f2b,#181312 70%);box-shadow:0 0 26px #8e433b44;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:eventIn .18s ease-out}
.eventCard.trap{border-color:#a87345;background:radial-gradient(circle,#55402b,#181411 70%)}.eventCard.heal{border-color:#65916f;background:radial-gradient(circle,#304c37,#111512 70%)}
#eventArt{font-size:58px;line-height:1}.eventCard .diceTitle{font-size:10px;letter-spacing:1.5px;font-weight:900;color:#e1c99b}
#tapContinue{opacity:0;font-size:10px;letter-spacing:2px;color:#92887b;transition:opacity .15s}.resolved #tapContinue{opacity:1}
.cell.entry-pulse .floor{animation:roomEntry .2s ease-out}@keyframes roomEntry{0%{transform:scale(.82);filter:brightness(1.8)}100%{transform:scale(1);filter:brightness(1)}}@keyframes eventIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
/* Landmarks stay readable while their room surfaces retain distance lighting. */
.cell.landmark .floor,.cell.landmark .icon,.cell.landmark .event{opacity:var(--room-opacity);filter:saturate(var(--room-saturation))}
.cell.landmark .startMark,.cell.landmark .exitMark{left:50%;transform:translateX(-50%);z-index:9;white-space:nowrap;font-size:9px;font-weight:900;letter-spacing:.5px;line-height:15px;padding:0 4px;border-radius:4px;background:#151310e6;text-shadow:0 1px 3px #000;opacity:1}
.cell.landmark .startMark{top:-8px;color:#e1e8f0;border:1px solid #aeb9cd88;box-shadow:0 0 7px #cedaf333}
.cell.landmark .exitMark{bottom:-8px;color:#ffe0a0;border:1px solid #d4b47399;box-shadow:0 0 8px #eac47944}
.cell.exit-landmark::before{content:"";position:absolute;inset:-2px;z-index:7;border:1px solid #edca83;border-radius:8px;pointer-events:none;animation:exitBeacon 2.4s ease-in-out infinite}
.cell.scavenged .floor::after{content:"✓";position:absolute;right:2px;top:0;color:#8c8275;font-size:8px;font-weight:900;text-shadow:0 1px 2px #000}
.cell.clued:not(.searched) .floor{border-color:#79a5b5;box-shadow:0 0 12px #69a4bd55,inset 0 2px #ffffff0b}
.cell.clued:not(.searched)::before{content:"⌁";position:absolute;left:50%;top:-8px;transform:translateX(-50%);z-index:9;color:#a8d6e7;font-size:11px;text-shadow:0 0 6px #72bad5}
@keyframes exitBeacon{0%,100%{opacity:.5;box-shadow:0 0 4px #ebc47a22}50%{opacity:.95;box-shadow:0 0 10px #ebc47a66}}
@media(prefers-reduced-motion:reduce){.cell.exit-landmark::before{animation:none;opacity:.75}}

/* V2.9 readability hierarchy */
.cell .floor{transition:background .2s ease,border-color .2s ease,box-shadow .25s ease,filter .2s ease}
.cell.current{opacity:1!important;filter:none!important;z-index:12}
.cell.current .floor{background:radial-gradient(circle at 50% 38%,#8a754f 0,#62543e 45%,#423a31 100%)!important;border-color:#ffe09a!important;box-shadow:0 0 18px #ffd579dd,0 0 42px #d9a94f88,0 0 72px #c58a3044,inset 0 2px #fff5c955,inset 0 -4px #21170d88!important;filter:brightness(1.25) saturate(1.08)}
.cell.current .currentGlyph{font-size:22px;color:#fff0bd;text-shadow:0 0 5px #fff3c7,0 0 13px #efbc58,0 2px 3px #000;animation:currentBreath 1.8s ease-in-out infinite;transform-origin:center}
.cell.light-near:not(.current) .floor{filter:brightness(1.13);box-shadow:0 0 15px #c8a45d55,inset 0 2px #ffffff14,inset 0 -3px #0006}
.cell.light-mid:not(.current) .floor{filter:brightness(.92);box-shadow:0 0 8px #b8945828,inset 0 2px #ffffff0b,inset 0 -3px #0006}
.cell.light-far:not(.current) .floor{filter:brightness(.66)}
.cell.current-arrival .floor{animation:currentArrival .28s ease-out}
.cell.travel-step.current .floor{animation:travelArrival .18s ease-out}
.cell.entry-pulse.current .floor{animation:roomEntry .2s ease-out}
@keyframes currentBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes currentArrival{0%{transform:scale(.86);filter:brightness(2)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes travelArrival{0%{transform:scale(.82);filter:brightness(2.2)}100%{transform:scale(1);filter:brightness(1.25)}}

/* Ambiguous tendency hints: never event names or event icons. */
.cell.unknown.hint-danger .floor{background:radial-gradient(circle at 50% 65%,rgba(164,69,42,var(--hint-alpha)),#40362f 70%);border-color:rgba(184,91,58,.72)}
.cell.unknown.hint-fortune .floor{background:radial-gradient(circle at 68% 30%,rgba(202,163,67,var(--hint-alpha)),#413a2f 68%);border-color:rgba(190,154,67,.78)}
.cell.unknown.hint-safe .floor{background:radial-gradient(circle at 45% 45%,rgba(70,145,101,var(--hint-alpha)),#333d35 72%);border-color:rgba(87,157,112,.72)}
.cell.unknown.hint-fortune::after{content:"";position:absolute;right:5px;top:5px;width:2px;height:2px;border-radius:50%;z-index:7;background:#f5d47e;box-shadow:-5px 7px #c8a856,3px 10px #8f783e;opacity:calc(.35 + var(--hint-alpha));pointer-events:none}
.cell.frontier{opacity:var(--frontier-room-opacity)!important}.cell.frontier .icon{opacity:1!important;color:#e1d8c9;font-size:15px;text-shadow:0 1px 3px #000,0 0 7px #d6c49a88;animation:frontierBreath 2.8s ease-in-out infinite}.cell.frontier .floor{opacity:var(--frontier-floor-opacity);filter:brightness(var(--frontier-brightness))}.cell.frontier.hint-danger .floor,.cell.frontier.hint-fortune .floor,.cell.frontier.hint-safe .floor{box-shadow:0 0 9px rgba(190,145,75,var(--frontier-hint-alpha)),inset 0 2px #ffffff09}
@keyframes frontierBreath{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){.cell.current .currentGlyph{animation:none}.cell.current-arrival .floor,.cell.travel-step.current .floor{animation:none}}

/* Room-local feedback and quick reward celebration */
#feedbackLayer{position:absolute;inset:0;z-index:30;overflow:hidden;pointer-events:none}
.roomFeedback{position:absolute;z-index:1;min-width:100px;text-align:center;font-weight:950;line-height:1.12;color:#fff4cf;text-shadow:0 2px 3px #000,0 0 7px #000;pointer-events:none;transition:top .18s ease-out,left .18s ease-out,opacity .18s ease-out,transform .18s ease-out;transform-origin:top center;white-space:normal;overflow-wrap:anywhere}
.roomFeedback .calc{font-size:9px;color:#f4d58a;letter-spacing:.4px}.roomFeedback .reward{font-size:19px}.roomFeedback.bad .reward{color:#ff9b85}.roomFeedback.clue .reward{color:#a9ddeb}.roomFeedback.fate .reward{color:#ffd575}
.feedbackBody{animation:feedbackFloat var(--life,1000ms) ease-out forwards}
@keyframes feedbackFloat{0%{opacity:0;transform:translateY(4px)}15%,72%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
.cell.treasure-celebrate .floor{animation:treasureFlash .9s ease-out!important}.cell.rich-celebrate .floor{animation:richFlash 1.05s ease-out!important}
.cell.treasure-celebrate .event{animation:treasurePop .75s cubic-bezier(.2,.9,.25,1.35)}
.coinParticle{position:absolute;left:50%;top:48%;z-index:25;width:4px;height:4px;border-radius:50%;background:#ffd66d;box-shadow:0 0 5px #ffc13b;pointer-events:none;animation:coinBurst var(--dur) ease-out forwards}
@keyframes treasureFlash{0%{filter:brightness(2.5);box-shadow:0 0 16px #ffd66d,0 0 44px #d99b28}100%{filter:brightness(1.25)}}
@keyframes richFlash{0%{filter:brightness(3);box-shadow:0 0 22px #fff0a0,0 0 58px #e0a438,0 0 82px #ad6bd655}100%{filter:brightness(1.25)}}
@keyframes treasurePop{0%{transform:scale(.4) rotate(-12deg)}42%{transform:scale(1.75) rotate(8deg)}72%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes coinBurst{0%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.4)}}
.tutorialGesture{position:absolute;left:50%;bottom:78%;transform:translateX(-50%);z-index:22;color:#fff0bd;text-align:center;font-size:9px;font-weight:950;line-height:10px;letter-spacing:1px;text-shadow:0 1px 4px #000;pointer-events:none;animation:tutorialBob 1.8s ease-in-out infinite}
.tutorialGesture b{display:block;font-size:15px;line-height:15px}.tutorialGesture::after{content:"";position:absolute;left:50%;top:27px;width:30px;height:30px;transform:translateX(-50%);border-radius:8px;padding:2px;background:conic-gradient(#f0ca78 0 135deg,transparent 135deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.72;animation:tutorialRing 1.8s ease-in-out infinite}
.cell.exit-landmark.floor-complete::before{border-color:#f6dc8c;box-shadow:0 0 12px #f5d77a99,0 0 25px #d8a84244;opacity:1}
@keyframes tutorialBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
@keyframes tutorialRing{0%,100%{opacity:.3}50%{opacity:.9}}
#message{color:#d9cba9;font-weight:750;letter-spacing:.2px}
.scoreCounting{color:#ffe08a;text-shadow:0 0 8px #e9b94f}
@media(prefers-reduced-motion:reduce){.roomFeedback,.cell.treasure-celebrate .floor,.cell.rich-celebrate .floor,.cell.treasure-celebrate .event,.coinParticle,.tutorialGesture,.tutorialGesture::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* Stronger encounter die: dark relic, energetic tumble, decisive landing. */
.die{position:relative;width:104px;height:104px;margin:14px auto 8px;background:radial-gradient(circle at 38% 30%,#493f33 0,#211d19 48%,#0e0c0b 100%);color:#ffe5a2;border:2px solid #8f7447;border-radius:20px;font-size:74px;text-shadow:0 0 10px #ffd36dbb,0 3px 4px #000;box-shadow:0 8px 22px #000b,inset 0 2px #ffffff16,inset 0 -5px #0008;transform-style:preserve-3d}
.die::before{content:"";position:absolute;inset:-8px;border:1px solid #c99d5244;border-radius:22px;opacity:.55;box-shadow:0 0 18px #d29d4144;pointer-events:none}
.die.rolling{width:132px;height:132px;font-size:92px;margin:0 auto 2px;border-radius:24px;animation:diceTumble .34s cubic-bezier(.4,0,.6,1) infinite;box-shadow:0 0 32px #e2ad52cc,0 13px 30px #000d,inset 0 2px #fff4c444}
.die.rolling::before{opacity:1;box-shadow:0 0 28px #e2aa4c88;animation:dieAura .34s ease-in-out infinite alternate}
.die.landed{animation:dieLand .42s cubic-bezier(.2,.8,.25,1.2)}
@keyframes diceTumble{0%{transform:translateY(5px) rotate(-14deg) rotateY(0) scale(.82);filter:brightness(.8)}25%{transform:translateY(-9px) rotate(11deg) rotateY(90deg) scale(1.1);filter:brightness(1.45)}50%{transform:translateY(2px) rotate(-8deg) rotateY(180deg) scale(.94)}75%{transform:translateY(-7px) rotate(14deg) rotateY(270deg) scale(1.08);filter:brightness(1.35)}100%{transform:translateY(5px) rotate(-14deg) rotateY(360deg) scale(.82);filter:brightness(.8)}}
@keyframes dieLand{0%{transform:translateY(-12px) rotate(8deg) scale(1.22);filter:brightness(1.8)}45%{transform:translateY(3px) rotate(-3deg) scale(.92)}72%{transform:translateY(-2px) rotate(1deg) scale(1.06)}100%{transform:none;filter:none}}
@keyframes dieAura{from{transform:scale(.9);opacity:.35}to{transform:scale(1.12);opacity:1}}
.diceResult.rollCall{font-size:25px;letter-spacing:1.5px;color:#ffe09a;text-shadow:0 0 12px #e5ae50aa}
.diceDetail .outcome{display:block;margin-bottom:4px;font-size:22px;line-height:24px;color:#fff0c5;letter-spacing:1px;text-shadow:0 0 10px #d9a84f77}.diceDetail .consequence{display:block;font-size:12px;color:#c8bcad}
@media(prefers-reduced-motion:reduce){.die.rolling,.die.rolling::before,.die.landed{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* V2.13: clue certainty is distinct from ordinary, ambiguous frontier hints. */
.cell.clued.unknown{--clue-color:#90c999}
.cell.clued.hint-danger{--clue-color:#ef8875}
.cell.clued.hint-fortune{--clue-color:#f3ce77}
.cell.clued.hint-stairs{--clue-color:#c4c3ff}
.cell.clued.unknown .floor{opacity:1!important;filter:brightness(1.12)!important;border-color:var(--clue-color)!important;box-shadow:0 0 10px color-mix(in srgb,var(--clue-color) 55%,transparent)!important}
.cell.clued.unknown .clueMark{position:absolute;left:50%;top:-9px;transform:translateX(-50%);z-index:10;color:#b2edff;font-size:14px;line-height:16px;text-shadow:0 1px 3px #000,0 0 6px #54cfff;pointer-events:none}
.cell.clued.unknown::before{content:none}
.cell.clue-reveal .floor{animation:clueTendency .6s ease-in-out 3;animation-delay:var(--clue-delay)}
.clueRing{position:absolute;inset:-5px;z-index:10;border:2px solid #a2eaff;border-radius:50%;pointer-events:none;animation:cluePulse .6s ease-out 3;animation-delay:var(--clue-delay)}
.roomFeedback.clue-danger .reward{color:#ff9b85}.roomFeedback.clue-fortune .reward{color:#ffe09a}.roomFeedback.clue-safe .reward{color:#a7e1b0}.roomFeedback.clue-stairs .reward{color:#d3d0ff}
@keyframes cluePulse{0%{transform:scale(.75);opacity:1}100%{transform:scale(1.8);opacity:0}}
@keyframes clueTendency{0%,100%{background-color:transparent}50%{background:var(--clue-color)}}
/* Combat has its own gesture; map holds retain their existing behavior. */
#diceOverlay{touch-action:none;overscroll-behavior:none;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
#eventCard{position:relative;touch-action:none;flex-shrink:0}
.swipeCue{display:none;position:absolute;left:12%;right:12%;bottom:5%;height:28px;color:#fff1cc;pointer-events:none}
.awaiting-swipe .swipeCue{display:block}
.swipeCue::before{content:"↔";position:absolute;left:0;right:0;top:0;font-size:32px;opacity:.35}
.swipeCue::after{content:"";position:absolute;top:8px;left:10%;width:15px;height:15px;border:2px solid #fff1cc;background:#d8bf8640;border-radius:50%;opacity:0;animation:swipeDemo 2.2s ease-in-out .65s infinite}
.awaiting-swipe #die{opacity:.22;transform:scale(.78)}
.awaiting-swipe #eventCard{border-color:#d49775;box-shadow:0 0 24px #a94e3544}
.eventCard.swipe-impact{animation:swipeImpact .24s ease-out}
